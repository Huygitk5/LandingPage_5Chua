<footer class="site-footer wave-top">
  <div class="container footer-inner">
    <p class="footer-brand">{{brandUpper}} &middot; {{tagline}}</p>
    <p class="footer-meta">{{address}} &middot; <a href="tel:{{phoneIntl}}">{{phoneDisplay}}</a></p>
    <p class="footer-meta">&copy; <span id="year">2026</span> {{brand}}. Chất lượng 100% tự nhiên.</p>
  </div>
</footer>

<div class="float-actions" aria-label="Liên hệ nhanh">
  <a class="float-btn float-call" href="tel:{{phoneIntl}}">
    <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span>Gọi ngay</span>
  </a>
  <a class="float-btn float-zalo" href="https://zalo.me/{{zalo}}" target="_blank" rel="noopener">
    <svg class="icon" aria-hidden="true"><use href="#i-zalo"/></svg><span>Zalo</span>
  </a>
</div>
