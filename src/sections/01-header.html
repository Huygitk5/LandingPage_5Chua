<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="#trang-chu" aria-label="{{brand}} – về đầu trang">
      <svg class="icon brand-mark" aria-hidden="true"><use href="#i-hex"/></svg>
      <span class="brand-name">{{brandUpper}}</span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Menu chính">
      <a href="#gioi-thieu">Giới thiệu</a>
      <a href="#san-pham">Sản phẩm</a>
      <a href="#cach-dat-hang">Cách đặt hàng</a>
      <a href="#lien-he">Liên hệ</a>
    </nav>

    <a class="btn btn-accent header-call" href="tel:{{phoneIntl}}" aria-label="Gọi ngay {{phoneDisplay}}">
      <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
      <span>Gọi ngay</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Mở menu">
      <svg class="icon icon-open" aria-hidden="true"><use href="#i-menu"/></svg>
      <svg class="icon icon-close" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
</header>
