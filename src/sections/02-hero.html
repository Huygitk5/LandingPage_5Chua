<section class="hero wave-bottom" id="trang-chu">
  <svg class="leaf leaf-1" aria-hidden="true"><use href="#i-leafshape"/></svg>
  <svg class="leaf leaf-2" aria-hidden="true"><use href="#i-leafshape"/></svg>

  <div class="container hero-inner">
    <div class="hero-copy" data-reveal>
      <p class="eyebrow">Cơ sở nuôi ong từ năm {{since}}</p>
      <h1>{{tagline}}</h1>
      <p class="lead">Mật ong, sữa ong chúa, tinh bột nghệ, cùng hoa lan và cây giống cacao, bòn bon. Đảm bảo chất lượng 100% tự nhiên. Hân hạnh phục vụ quý khách.</p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="tel:{{phoneIntl}}">
          <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
          <span>Gọi {{phoneDisplay}}</span>
        </a>
        <a class="btn btn-outline btn-lg" href="https://zalo.me/{{zalo}}" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#i-zalo"/></svg>
          <span>Nhắn Zalo</span>
        </a>
      </div>
      <a class="hero-link" href="#san-pham">Xem sản phẩm &darr;</a>
    </div>

    <figure class="hero-figure" data-reveal data-delay="2">
      <img src="assets/img/intro1.webp" width="583" height="1200" alt="Dãy thùng nuôi ong dưới tán vườn cây ở Chợ Lách, Bến Tre" fetchpriority="high">    </figure>
  </div>
</section>
